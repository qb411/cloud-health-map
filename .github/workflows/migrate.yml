name: Supabase Migrations

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref voeenhiihmgtfywcrker
          supabase db push
