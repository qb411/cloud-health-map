<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Health Map</title>
    <meta property="og:title" content="Cloud Health Map" />
    <meta property="og:description" content="Multi-cloud health status dashboard — AWS, Azure, GCP" />
    <meta property="og:image" content="/cloud-health-map/og-image.png" />

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https: blob:;
        connect-src 'self'
          https://*.supabase.co
          https://status.aws.amazon.com
          https://status.azure.com
          https://status.cloud.google.com
          https://ocistatus.oraclecloud.com
          https://api.allorigins.win
          https://flagcdn.com
          wss://*.supabase.co;
        frame-src 'none';
        frame-ancestors 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
